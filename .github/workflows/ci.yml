name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Estilo y convencion de nombres
        run: |
          ruff check src tests
          python scripts/check_naming_convention.py

      # La logica del visor se prueba con el ejecutor de Node, sin npm ni dependencias
      # (research.md R14 de la funcionalidad 004). Desde Node 22, --test recibe patrones
      # de archivo y no carpetas: por eso el patron entre comillas.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pruebas del visor
        run: node --test "tests/unit/web/*.js"

      - name: Limites entre capas
        run: pytest -m architecture -v

      - name: Pruebas unitarias con cobertura
        run: pytest -m unit --cov --cov-report=xml

      # El umbral del 80 % se mide solo sobre services/. Los cuatro modulos que importan
      # PyTorch no cuentan: el CI no instala el extra "ml" y esos modulos solo corren con
      # las pruebas "ml", que se miden en local (research.md R17 de la funcionalidad 002).
      - name: Cobertura de services
        run: >-
          coverage report --include="src/radvol3d/services/*"
          --omit="*/en1_network.py,*/en1_reconstructor.py,*/lung_unet_network.py,*/lung_segmenter.py"
          --fail-under=80

      # SC-007 de la funcionalidad 004: la capa de presentacion tambien con al menos 80 %.
      - name: Cobertura de api
        run: coverage report --include="src/radvol3d/api/*" --fail-under=80
